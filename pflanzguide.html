<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Pflanzen-Dashboard V3</title>
    <style>
        :root {
            --bg-main: #f4f7f4;
            --panel-bg: #ffffff;
            --text-dark: #1e291b;
            --text-muted: #556b2f;
            --primary: #2d5a27;
            --primary-light: #eaf2e8;
            --accent: #689f38;
            --border-color: #dae3da;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .navigation-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
        }

        .nav-tab.active { background-color: var(--primary); color: white; }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            min-width: 280px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
