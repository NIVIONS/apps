<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track & Travel</title>
    
    <!-- Tailwind CSS (mit Dark Mode Support) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Spezielle Druck-Stile für den PDF/A4 Export */
        @media print {
            body { background-color: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd !important; padding: 8px; text-align: left; font-size: 12px; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            .dark-print-fix { color: black !important; }
            .print-month-header { background-color: #e5e7eb !important; font-weight: bold; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_SETTINGS = {
          initialZeitkonto: 0,
          initialPersonalMoney: 0,
          initialCreditCardDebt: 0,
          dailyBaseHours: 7,
          maxZeitkonto: 200,
          hourlyRate: 25.54,
          overtimeBonusPercent: 25,
          overtimeBonusSpecialPercent: 50,
          spesenSmallHours: 8,
          spesenSmallAmount: 14,
          spesenLargeAmount: 28,
          breakfastDeduction: 5.60,
          overnightFlatrateWithoutReceipt: 30, // ⚠️ Unter Vorbehalt
          overnightFlatrateWithReceipt: 30,
          geminiApiKey: ''
        };

        const calculateDuration = (start, end, breakMinutes) => {
          if (!start || !end) return 0;
          const [startH, startM] = start.split(':').map(Number);
          const [endH, endM] = end.split(':').map(Number);
          
          let durationMinutes = (endH * 60 + endM) - (startH * 60 + startM);
          if (durationMinutes < 0) durationMinutes += 24 * 60; // Cross midnight
          
          durationMinutes -= (breakMinutes || 0);
          return Math.max(0, durationMinutes / 60);
        };

        const formatMonthName = (yyyyMM) => {
            const [y, m] = yyyyMM.split('-');
            const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
            return `${months[parseInt(m, 10) - 1]} ${y}`;
        };

        function SpesenTracker() {
          // States
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isScanning, setIsScanning] = useState(false);
          const fileInputRef = useRef(null);
          
          const [isDarkMode, setIsDarkMode] = useState(() => {
            return localStorage.getItem('theme') === 'dark';
          });

          const [settings, setSettings] = useState(() => {
            const saved = localStorage.getItem('spesenSettings');
            return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
          });
          
          const [entries, setEntries] = useState(() => {
            const saved = localStorage.getItem('spesenEntries');
            return saved ? JSON.parse(saved) : [];
          });

          // Effects for saving
          useEffect(() => {
            localStorage.setItem('spesenSettings', JSON.stringify(settings));
          }, [settings]);

          useEffect(() => {
            localStorage.setItem('spesenEntries', JSON.stringify(entries));
          }, [entries]);

          // Dark Mode Toggle Effect
          useEffect(() => {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
          }, [isDarkMode]);

          // Berechnungs-Logik: Stats + Monatlich gruppierte Einträge
          const { stats, groupedEntries } = useMemo(() => {
            let currentZeitkonto = Number(settings.initialZeitkonto || 0);
            let totalPayoutCurrentMonth = 0; 
            let personalMoney = Number(settings.initialPersonalMoney || 0);
            let creditCardDebt = Number(settings.initialCreditCardDebt || 0); 
            let auslagenErstattung = 0; 

            const currentMonthStr = new Date().toISOString().substring(0, 7);
            const groups = {};
            
            // WICHTIG: Chronologisch sortieren (älteste zuerst), damit das Zeitkonto korrekt hochzählt!
            const sortedEntries = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedEntries.forEach(entry => {
              let calc = {
                 payoutBase: 0, payoutBonus25: 0, payoutBonus50: 0, totalLohn: 0,
                 hoursZeitkonto: 0, spesenTag: 0, 
                 uebernachtungspauschale: 0, auslagenTag: 0
              };

              if (entry.type === 'work') {
                const overtime = Math.max(0, entry.duration - settings.dailyBaseHours);
                
                let hoursToZeitkonto = 0;
                let baseHoursToPayout = 0;
                let bonus25Hours = 0;
                let bonus50Hours = 0;

                if (overtime > 0) {
                  let spaceLeft = Math.max(0, settings.maxZeitkonto - currentZeitkonto);

                  // 1. Überstunde
                  const h1 = Math.min(1, overtime);
                  const k1 = Math.min(h1, spaceLeft);
                  const p1 = h1 - k1; 
                  
                  hoursToZeitkonto += k1;
                  spaceLeft -= k1;
                  baseHoursToPayout += p1;
                  bonus25Hours += p1; 

                  // 2. Überstunde
                  const h2 = Math.min(1, Math.max(0, overtime - 1));
                  const k2 = Math.min(h2, spaceLeft);
                  const p2 = h2 - k2;

                  hoursToZeitkonto += k2;
                  spaceLeft -= k2;
                  baseHoursToPayout += p2;
                  bonus25Hours += h2; // Bonus immer auf volle 2. Stunde

                  // Ab 3. Überstunde
                  const h3 = Math.max(0, overtime - 2);
                  baseHoursToPayout += h3;
                  bonus50Hours += h3;
                }

                currentZeitkonto += hoursToZeitkonto;
                calc.hoursZeitkonto = hoursToZeitkonto;

                // Geld-Berechnung Lohn (Kaufmännisches Runden auf 2 Nachkommastellen)
                calc.payoutBase = Number((baseHoursToPayout * settings.hourlyRate).toFixed(2));
                
                if (overtime > 0) {
                  calc.payoutBonus25 = Number((bonus25Hours * settings.hourlyRate * (settings.overtimeBonusPercent / 100)).toFixed(2));
                  calc.payoutBonus50 = Number((bonus50Hours * settings.hourlyRate * ((settings.overtimeBonusSpecialPercent || 50) / 100)).toFixed(2));
                }
                
                calc.totalLohn = Number((calc.payoutBase + calc.payoutBonus25 + calc.payoutBonus50).toFixed(2));
                
                // Lohn nur für Dashboard addieren, wenn es der aktuelle Monat ist
                if (entry.date.startsWith(currentMonthStr)) {
                   totalPayoutCurrentMonth += calc.totalLohn;
                }

                // Spesen
                const durationGross = calculateDuration(entry.startTime, entry.endTime, 0);
                if (durationGross >= 24) {
                  calc.spesenTag = settings.spesenLargeAmount;
                } else if (durationGross >= settings.spesenSmallHours) {
                  calc.spesenTag = settings.spesenSmallAmount;
                }
                if (entry.breakfastIncluded) calc.spesenTag -= (settings.breakfastDeduction || 5.60);
                
                personalMoney += calc.spesenTag;

                // Übernachtungspauschale
                if (entry.overnight === 'receipt') calc.uebernachtungspauschale = settings.overnightFlatrateWithReceipt;
                else if (entry.overnight === 'noreceipt') calc.uebernachtungspauschale = settings.overnightFlatrateWithoutReceipt;
                
                personalMoney += calc.uebernachtungspauschale;

                // Auslagen
                const hotelCost = Number(entry.hotelCost || 0);
                const parkCost = Number(entry.parkCost || 0);
                const sonstigesCost = Number(entry.sonstigesCost || 0);
                
                calc.auslagenTag = hotelCost + parkCost + sonstigesCost;
                creditCardDebt += calc.auslagenTag;
                auslagenErstattung += calc.auslagenTag;

              } else if (entry.type === 'abbummeln') {
                currentZeitkonto -= entry.hours;
                calc.hoursZeitkonto = -entry.hours;
              } else if (entry.type === 'cc_paid') {
                creditCardDebt -= entry.amount;
              }

              // In Monats-Gruppen einsortieren
              const monthKey = entry.date.substring(0, 7); // "YYYY-MM"
              if (!groups[monthKey]) {
                 groups[monthKey] = {
                    entries: [],
                    sums: { lohn: 0, spesen: 0, auslagen: 0 }
                 };
              }
              groups[monthKey].entries.push({ ...entry, calc });
              
              if (entry.type === 'work') {
                 groups[monthKey].sums.lohn += calc.totalLohn || 0;
                 groups[monthKey].sums.spesen += (calc.spesenTag || 0) + (calc.uebernachtungspauschale || 0);
                 groups[monthKey].sums.auslagen += calc.auslagenTag || 0;
              }
            });

            // Einträge innerhalb der Monate umkehren (neueste oben)
            Object.keys(groups).forEach(key => {
               groups[key].entries.reverse();
            });

            const totalSpesenkonto = personalMoney + auslagenErstattung;

            return {
              stats: {
                 zeitkonto: currentZeitkonto.toFixed(2),
                 payoutCurrentMonth: totalPayoutCurrentMonth.toFixed(2),
                 spesenkonto: totalSpesenkonto.toFixed(2),
                 creditCardDebt: creditCardDebt.toFixed(2)
              },
              groupedEntries: groups
            };
          }, [entries, settings]);

          const [formData, setFormData] = useState({
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '16:15',
            breakMinutes: 45,
            overnight: 'none',
            hotelCost: '',
            parkCost: '',
            sonstigesCost: '',
            breakfastIncluded: false
          });

          const handleInputChange = (e) => {
            const { name, value, type, checked } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: type === 'checkbox' ? checked : value
            }));
          };

          // Funktion zum Runden auf 15-Minuten Schritte beim Verlassen des Feldes
          const handleTimeBlur = (e) => {
            const { name, value } = e.target;
            if (!value) return;
            
            const [h, m] = value.split(':').map(Number);
            const roundedM = Math.round(m / 15) * 15;
            
            let newH = h;
            let newM = roundedM;
            
            if (roundedM === 60) {
               newM = 0;
               newH = (h + 1) % 24;
            }
            
            setFormData(prev => ({
               ...prev,
               [name]: `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`
            }));
          };

          const handleAddEntry = (e) => {
            e.preventDefault();
            const duration = calculateDuration(formData.startTime, formData.endTime, formData.breakMinutes);
            
            const newEntry = {
              id: Date.now().toString(),
              type: 'work',
              duration,
              ...formData
            };

            setEntries([...entries, newEntry]); 
            setFormData(prev => ({ ...prev, hotelCost: '', parkCost: '', sonstigesCost: '', overnight: 'none', breakfastIncluded: false }));
            setActiveTab('history'); 
          };

          const deleteEntry = (id) => {
            if(window.confirm("Eintrag wirklich löschen?")) {
               setEntries(entries.filter(e => e.id !== id));
            }
          };

          const handleAbbummeln = () => {
            const hours = parseFloat(prompt("Wie viele Stunden vom Zeitkonto abbummeln?"));
            if (hours && hours > 0) {
              setEntries([...entries, { id: Date.now().toString(), type: 'abbummeln', date: new Date().toISOString().split('T')[0], hours }]);
            }
          };

          const handleCCPaid = () => {
            const amount = parseFloat(prompt("Welcher Betrag wurde von der Kreditkarte abgebucht?"));
            if (amount && amount > 0) {
              setEntries([...entries, { id: Date.now().toString(), type: 'cc_paid', date: new Date().toISOString().split('T')[0], amount }]);
            }
          };

          // --- Export / Import ---
          const exportJSON = () => {
             const dataStr = JSON.stringify({ settings, entries });
             const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
             const exportFileDefaultName = `TrackTravel_Backup_${new Date().toISOString().split('T')[0]}.json`;
             const linkElement = document.createElement('a');
             linkElement.setAttribute('href', dataUri);
             linkElement.setAttribute('download', exportFileDefaultName);
             linkElement.click();
          };

          const importJSON = (e) => {
             const file = e.target.files[0];
             if (!file) return;
             const reader = new FileReader();
             reader.onload = (event) => {
                try {
                   const data = JSON.parse(event.target.result);
                   if(data.settings) setSettings(data.settings);
                   if(data.entries) setEntries(data.entries);
                   alert("Daten erfolgreich importiert!");
                } catch(err) {
                   alert("Fehler beim Lesen der Datei. Ist es ein gültiges Backup?");
                }
             };
             reader.readAsText(file);
          };

          const exportCSV = () => {
             let csvContent = "data:text/csv;charset=utf-8,";
             csvContent += "Datum,Typ,Dauer(h),Start,Ende,Pause(Min),Lohn_Gesamt(€),Lohn_Grund(€),Bonus25(€),Bonus50(€),Zeitkonto(h),Spesen(€),Ü-Pauschale(€),Auslagen_Vorgestreckt(€)\n";
             
             // Alle Einträge für CSV flach klopfen
             const allEnriched = [];
             Object.values(groupedEntries).forEach(group => {
                 allEnriched.push(...group.entries);
             });

             allEnriched.forEach(e => {
                const c = e.calc || {};
                const row = [
                   e.date,
                   e.type,
                   e.duration ? e.duration.toFixed(2) : (e.hours ? `-${e.hours}` : ''),
                   e.startTime || '',
                   e.endTime || '',
                   e.breakMinutes || '',
                   c.totalLohn ? c.totalLohn.toFixed(2) : '',
                   c.payoutBase ? c.payoutBase.toFixed(2) : '',
                   c.payoutBonus25 ? c.payoutBonus25.toFixed(2) : '',
                   c.payoutBonus50 ? c.payoutBonus50.toFixed(2) : '',
                   c.hoursZeitkonto ? c.hoursZeitkonto.toFixed(2) : '',
                   c.spesenTag ? c.spesenTag.toFixed(2) : '',
                   c.uebernachtungspauschale ? c.uebernachtungspauschale.toFixed(2) : '',
                   c.auslagenTag ? c.auslagenTag.toFixed(2) : ''
                ].join(",");
                csvContent += row + "\n";
             });

             const encodedUri = encodeURI(csvContent);
             const link = document.createElement("a");
             link.setAttribute("href", encodedUri);
             link.setAttribute("download", `Zeiten_Detail_${new Date().toISOString().split('T')[0]}.csv`);
             document.body.appendChild(link);
             link.click();
          };

          const handleFileUpload = async (e) => {
             const file = e.target.files[0];
             if (!file) return;
             const apiKey = settings.geminiApiKey || "";
             if (!apiKey) {
                 alert("Bitte trage zuerst deinen API Key ein!"); return;
             }
             setIsScanning(true);
             try {
               const reader = new FileReader();
               reader.onloadend = async () => {
                 const base64Data = reader.result.split(',')[1];
                 const payload = { contents: [{ role: "user", parts: [{ text: "JSON Format: { \"date\": \"YYYY-MM-DD\", \"startTime\": \"HH:MM\", \"endTime\": \"HH:MM\", \"breakMinutes\": 45, \"hotelCost\": 0, \"parkCost\": 0 }. Nur pures JSON ohne Formatierung." }, { inlineData: { mimeType: file.type, data: base64Data } }] }], generationConfig: { responseMimeType: "application/json" } };
                 const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                 if (!response.ok) throw new Error("API Error");
                 const result = await response.json();
                 const data = JSON.parse(result.candidates[0].content.parts[0].text);
                 setFormData(prev => ({ ...prev, date: data.date||prev.date, startTime: data.startTime||prev.startTime, endTime: data.endTime||prev.endTime, breakMinutes: data.breakMinutes!==undefined?data.breakMinutes:45, hotelCost: data.hotelCost||prev.hotelCost, parkCost: data.parkCost||prev.parkCost }));
                 setIsScanning(false);
               };
               reader.readAsDataURL(file);
             } catch (error) { alert("Scan fehlgeschlagen."); setIsScanning(false); }
          };

          return (
            <div className="min-h-screen pb-10">
              {/* Navigation */}
              <nav className="bg-blue-900 dark:bg-gray-950 text-white p-4 shadow-md sticky top-0 z-10 no-print transition-colors">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <h1 className="text-xl font-bold flex items-center gap-2">
                    <i className="fa-solid fa-truck-fast text-xl"></i> Track & Travel
                  </h1>
                  <div className="flex gap-1 sm:gap-3 items-center">
                     {/* Theme Toggle */}
                     <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded hover:bg-blue-800 dark:hover:bg-gray-800 text-yellow-300 dark:text-blue-300 mr-2" title="Dark/Light Mode">
                        {isDarkMode ? <i className="fa-solid fa-sun text-lg"></i> : <i className="fa-solid fa-moon text-lg"></i>}
                     </button>

                     <button onClick={() => setActiveTab('dashboard')} className={`p-2 rounded ${activeTab === 'dashboard' ? 'bg-blue-800 dark:bg-gray-800' : 'hover:bg-blue-800 dark:hover:bg-gray-800'}`} title="Dashboard"><i className="fa-solid fa-chart-pie text-xl"></i></button>
                     <button onClick={() => setActiveTab('track')} className={`p-2 rounded ${activeTab === 'track' ? 'bg-blue-800 dark:bg-gray-800' : 'hover:bg-blue-800 dark:hover:bg-gray-800'}`} title="Neuer Eintrag"><i className="fa-solid fa-circle-plus text-xl"></i></button>
                     <button onClick={() => setActiveTab('history')} className={`p-2 rounded ${activeTab === 'history' ? 'bg-blue-800 dark:bg-gray-800' : 'hover:bg-blue-800 dark:hover:bg-gray-800'}`} title="Verlauf"><i className="fa-solid fa-book-open text-xl"></i></button>
                     <button onClick={() => setActiveTab('settings')} className={`p-2 rounded ${activeTab === 'settings' ? 'bg-blue-800 dark:bg-gray-800' : 'hover:bg-blue-800 dark:hover:bg-gray-800'}`} title="Einstellungen"><i className="fa-solid fa-gear text-xl"></i></button>
                  </div>
                </div>
              </nav>

              <main className="max-w-4xl mx-auto p-4 py-8 print-container">
                
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-bold border-b border-gray-200 dark:border-gray-700 pb-2">Konten & Übersicht</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {/* Zeitkonto Card */}
                      <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 flex flex-col items-center text-center">
                        <i className="fa-solid fa-clock text-4xl text-blue-500 mb-2"></i>
                        <h3 className="text-gray-500 dark:text-gray-400 font-medium">Zeitkonto (Gesamt)</h3>
                        <div className="text-4xl font-bold my-2">
                          {stats.zeitkonto} <span className="text-xl text-gray-400 font-normal">/ {settings.maxZeitkonto}h</span>
                        </div>
                        <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mt-2">
                          <div className="bg-blue-500 h-2.5 rounded-full" style={{ width: `${Math.min(100, (stats.zeitkonto / settings.maxZeitkonto) * 100)}%` }}></div>
                        </div>
                        <button onClick={handleAbbummeln} className="mt-4 text-sm text-blue-600 dark:text-blue-400 hover:underline"><i className="fa-solid fa-minus-circle"></i> Stunden abbummeln</button>
                      </div>

                      {/* Girokonto Card (Nur aktueller Monat) */}
                      <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 flex flex-col items-center text-center">
                        <i className="fa-solid fa-building-columns text-4xl text-emerald-500 mb-2"></i>
                        <h3 className="text-gray-500 dark:text-gray-400 font-medium">Lohn (Aktueller Monat)</h3>
                        <div className="text-4xl font-bold text-emerald-600 dark:text-emerald-400 my-2">
                          + {stats.payoutCurrentMonth} €
                        </div>
                        <p className="text-xs text-gray-400">Ausbezahlte Überstunden & Boni in diesem Monat</p>
                      </div>

                      {/* Spesenkonto (C24) Card */}
                      <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border-l-4 border-l-blue-400 dark:border-l-blue-500 flex flex-col items-center text-center md:col-span-2">
                        <div className="flex items-center justify-center gap-3 mb-2">
                            <i className="fa-solid fa-wallet text-3xl text-blue-600 dark:text-blue-400"></i>
                            <h3 className="text-gray-600 dark:text-gray-300 font-bold text-lg">Spesenkonto (Gesamt auf C24 Bank)</h3>
                        </div>
                        <div className="text-5xl font-bold text-blue-700 dark:text-blue-500 my-2">
                          {stats.spesenkonto} €
                        </div>
                        <p className="text-sm text-gray-500 dark:text-gray-400 max-w-lg mx-auto">
                          Dieses Geld gehört auf dein separates Spesenkonto. Es beinhaltet <b>Pauschalen</b> sowie die <b>Rückerstattung deiner vorgestreckten Auslagen</b>.
                        </p>
                      </div>

                      {/* CC Debt Card */}
                      <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700 flex flex-col items-center text-center md:col-span-2">
                        <div className="flex justify-between w-full items-center mb-4">
                           <div className="flex items-center gap-2">
                               <i className="fa-solid fa-credit-card text-2xl text-red-500 dark:text-red-400"></i>
                               <h3 className="text-gray-600 dark:text-gray-300 font-medium text-left">Vorgestreckte Auslagen<br/><span className="text-xs text-gray-400">Offene Kreditkartenrechnung</span></h3>
                           </div>
                           <div className="text-3xl font-bold text-red-500 dark:text-red-400">
                             - {stats.creditCardDebt} €
                           </div>
                        </div>
                        <button onClick={handleCCPaid} className="w-full bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-700 dark:text-red-400 font-semibold py-3 px-4 rounded-lg text-sm transition-colors border border-red-200 dark:border-red-800">
                          <i className="fa-solid fa-check-double"></i> Kreditkarten-Abrechnung bezahlt
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'track' && (
                  <div className="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div className="p-6 bg-blue-50 dark:bg-blue-900/30 border-b border-blue-100 dark:border-blue-800 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-blue-900 dark:text-blue-100">Neuer Eintrag</h2>
                        <p className="text-sm text-blue-700 dark:text-blue-300">Zeiten werden beim Klick in's nächste Feld auf 15-Min gerundet!</p>
                      </div>
                      <div>
                        <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                        <button onClick={() => fileInputRef.current?.click()} disabled={isScanning} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors shadow">
                          <i className="fa-solid fa-camera"></i> {isScanning ? 'Scannt...' : 'KI Scan'}
                        </button>
                      </div>
                    </div>
                    
                    <form onSubmit={handleAddEntry} className="p-6 space-y-8">
                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700 pb-2 flex items-center gap-2"><i className="fa-solid fa-clock text-blue-500"></i> Arbeitszeit</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Datum</label>
                            <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Pause (Minuten)</label>
                            <input type="number" name="breakMinutes" value={formData.breakMinutes} onChange={handleInputChange} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" min="0" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Startzeit</label>
                            <input type="time" name="startTime" value={formData.startTime} onChange={handleInputChange} onBlur={handleTimeBlur} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Endzeit</label>
                            <input type="time" name="endTime" value={formData.endTime} onChange={handleInputChange} onBlur={handleTimeBlur} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" required />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700 pb-2 flex items-center gap-2"><i className="fa-solid fa-bed text-indigo-500"></i> Reise & Übernachtung</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="col-span-1 md:col-span-2">
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-3">Übernachtungsart auswählen:</label>
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'none' ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-500' : 'hover:bg-gray-50 dark:hover:bg-gray-700 border-gray-200 dark:border-gray-600'}`}>
                                <input type="radio" name="overnight" value="none" checked={formData.overnight === 'none'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-house text-gray-400 block mb-1"></i> Keine
                              </label>
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'hotel' ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-500' : 'hover:bg-gray-50 dark:hover:bg-gray-700 border-gray-200 dark:border-gray-600'}`}>
                                <input type="radio" name="overnight" value="hotel" checked={formData.overnight === 'hotel'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-bell-concierge text-indigo-400 block mb-1"></i> Hotelbuchung
                              </label>
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'receipt' ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-500' : 'hover:bg-gray-50 dark:hover:bg-gray-700 border-gray-200 dark:border-gray-600'}`}>
                                <input type="radio" name="overnight" value="receipt" checked={formData.overnight === 'receipt'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-file-invoice text-emerald-400 block mb-1"></i> ÜP mit Beleg
                              </label>
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'noreceipt' ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-500' : 'hover:bg-gray-50 dark:hover:bg-gray-700 border-gray-200 dark:border-gray-600'}`}>
                                <input type="radio" name="overnight" value="noreceipt" checked={formData.overnight === 'noreceipt'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-user-group text-orange-400 block mb-1"></i> ÜP ohne Beleg
                              </label>
                            </div>
                          </div>

                          {formData.overnight === 'hotel' && (
                            <React.Fragment>
                              <div>
                                <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Hotelkosten (€)</label>
                                <input type="number" step="0.01" name="hotelCost" value={formData.hotelCost} onChange={handleInputChange} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" placeholder="0.00" />
                              </div>
                              <div className="flex items-center pb-2">
                                 <label className="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300 cursor-pointer bg-gray-100 dark:bg-gray-700 p-3 rounded-lg border border-gray-200 dark:border-gray-600 w-full">
                                  <input type="checkbox" name="breakfastIncluded" checked={formData.breakfastIncluded} onChange={handleInputChange} className="rounded" /> <i className="fa-solid fa-mug-hot text-amber-600"></i> inkl. Frühstück (-5,60€)
                                </label>
                              </div>
                            </React.Fragment>
                          )}
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700 pb-2 flex items-center gap-2"><i className="fa-solid fa-receipt text-red-500"></i> Weitere Auslagen</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Parkkosten (€)</label>
                            <input type="number" step="0.01" name="parkCost" value={formData.parkCost} onChange={handleInputChange} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" placeholder="0.00" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1">Sonstiges (Leihwagen etc.) (€)</label>
                            <input type="number" step="0.01" name="sonstigesCost" value={formData.sonstigesCost} onChange={handleInputChange} className="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-lg outline-none" placeholder="0.00" />
                          </div>
                        </div>
                      </div>

                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg">
                        <i className="fa-solid fa-floppy-disk text-xl"></i> Eintrag speichern
                      </button>
                    </form>
                  </div>
                )}

                {activeTab === 'history' && (
                  <div className="bg-white dark:bg-gray-800 rounded-xl shadow overflow-hidden print-container">
                     <div className="p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
                        <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100"><i className="fa-solid fa-book-open text-blue-600 mr-2"></i> Logbuch (Detail)</h2>
                        <div className="flex gap-2 no-print">
                           <button onClick={exportCSV} className="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 px-3 py-1.5 rounded flex items-center gap-2 text-sm shadow-sm"><i className="fa-solid fa-file-csv text-green-600"></i> CSV</button>
                           <button onClick={() => window.print()} className="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 px-3 py-1.5 rounded flex items-center gap-2 text-sm shadow-sm"><i className="fa-solid fa-print text-gray-600 dark:text-gray-300"></i> Druck</button>
                        </div>
                     </div>
                     <div className="overflow-x-auto">
                       <table className="w-full text-left border-collapse">
                         <thead>
                           <tr className="bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300 text-sm border-b dark:border-gray-600">
                             <th className="p-3">Datum / Zeit</th>
                             <th className="p-3">Lohn (Giro) & Zeitkonto</th>
                             <th className="p-3">Spesen & Auslagen (C24)</th>
                             <th className="p-3 no-print text-right">Aktion</th>
                           </tr>
                         </thead>
                         <tbody className="text-sm">
                           {Object.keys(groupedEntries).length === 0 ? (
                             <tr><td colSpan="4" className="p-8 text-center text-gray-400">Keine Einträge vorhanden</td></tr>
                           ) : Object.keys(groupedEntries).sort().reverse().map(monthKey => {
                               const group = groupedEntries[monthKey];
                               
                               return (
                                 <React.Fragment key={monthKey}>
                                    {/* Monats-Kopfzeile */}
                                    <tr className="bg-blue-50 dark:bg-blue-900/20 border-b border-t border-blue-100 dark:border-blue-800 print-month-header">
                                       <td colSpan="4" className="p-3">
                                          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center">
                                             <span className="font-bold text-blue-900 dark:text-blue-100 text-base mb-2 sm:mb-0">
                                                 <i className="fa-regular fa-calendar-days mr-2"></i>{formatMonthName(monthKey)}
                                             </span>
                                             <div className="flex gap-4 text-xs font-semibold">
                                                <span className="bg-white dark:bg-gray-800 text-emerald-600 dark:text-emerald-400 px-2 py-1 rounded shadow-sm border border-emerald-100 dark:border-emerald-800">
                                                    Σ Lohn: +{group.sums.lohn.toFixed(2)} €
                                                </span>
                                                <span className="bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 px-2 py-1 rounded shadow-sm border border-blue-100 dark:border-blue-800">
                                                    Σ Spesen/Ausl.: +{(group.sums.spesen + group.sums.auslagen).toFixed(2)} €
                                                </span>
                                             </div>
                                          </div>
                                       </td>
                                    </tr>

                                    {/* Einträge für diesen Monat */}
                                    {group.entries.map(entry => {
                                       const c = entry.calc || {};
                                       
                                       return (
                                       <tr key={entry.id} className="border-b border-gray-50 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                                         <td className="p-3 align-top">
                                           <div className="font-bold dark-print-fix">{new Date(entry.date).toLocaleDateString('de-DE')}</div>
                                           {entry.type === 'work' && (
                                             <div className="text-gray-500 dark:text-gray-400 mt-1">
                                               <span className="text-blue-600 dark:text-blue-400 font-bold">{entry.duration.toFixed(2)}h</span><br/>
                                               {entry.startTime} - {entry.endTime}<br/>
                                               (Pause: {entry.breakMinutes}m)
                                             </div>
                                           )}
                                           {entry.type === 'abbummeln' && <span className="text-orange-600 font-semibold mt-1 block">Abbummeln</span>}
                                           {entry.type === 'cc_paid' && <span className="text-green-600 font-semibold mt-1 block">KK bezahlt</span>}
                                         </td>
                                         
                                         <td className="p-3 align-top">
                                           {entry.type === 'work' && (
                                             <div className="space-y-1">
                                                <div className="text-emerald-600 dark:text-emerald-400 font-bold">Lohn: +{c.totalLohn?.toFixed(2)} €</div>
                                                <div className="text-xs text-gray-500 dark:text-gray-400 pl-2 border-l-2 border-gray-200 dark:border-gray-600 ml-1">
                                                  • Grund: {c.payoutBase?.toFixed(2)} €<br/>
                                                  • Bonus(25%): {c.payoutBonus25?.toFixed(2)} €<br/>
                                                  • Bonus(50%): {c.payoutBonus50?.toFixed(2)} €
                                                </div>
                                                <div className="text-blue-600 dark:text-blue-400 font-bold mt-2">Konto: +{c.hoursZeitkonto?.toFixed(2)}h</div>
                                             </div>
                                           )}
                                           {entry.type === 'abbummeln' && <span className="text-orange-600 font-bold">-{entry.hours}h</span>}
                                         </td>

                                         <td className="p-3 align-top">
                                           {entry.type === 'work' && (
                                             <div className="space-y-1">
                                                <div className="text-blue-700 dark:text-blue-400 font-bold">Spesen: +{c.spesenTag?.toFixed(2)} €</div>
                                                
                                                {c.uebernachtungspauschale > 0 && (
                                                  <div className="text-indigo-600 dark:text-indigo-400 font-bold">Ü-Pausch.: +{c.uebernachtungspauschale.toFixed(2)} €</div>
                                                )}
                                                
                                                {c.auslagenTag > 0 && (
                                                  <div className="mt-2">
                                                    <div className="text-red-600 dark:text-red-400 font-bold">Auslagen: +{c.auslagenTag.toFixed(2)} €</div>
                                                    <div className="text-xs text-gray-500 dark:text-gray-400 pl-2 border-l-2 border-gray-200 dark:border-gray-600 ml-1">
                                                      {entry.hotelCost > 0 && `• Hotel: ${entry.hotelCost}€ `}<br/>
                                                      {entry.parkCost > 0 && `• Parken: ${entry.parkCost}€ `}<br/>
                                                      {entry.sonstigesCost > 0 && `• Sonst.: ${entry.sonstigesCost}€`}
                                                    </div>
                                                  </div>
                                                )}
                                             </div>
                                           )}
                                           {entry.type === 'cc_paid' && <span className="text-green-600 font-bold">-{entry.amount} € Ausgleich</span>}
                                         </td>

                                         <td className="p-3 text-right no-print align-top">
                                           <button onClick={() => deleteEntry(entry.id)} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button>
                                         </td>
                                       </tr>
                                       );
                                    })}
                                 </React.Fragment>
                               );
                           })}
                         </tbody>
                       </table>
                     </div>
                  </div>
                )}

                {activeTab === 'settings' && (
                  <div className="bg-white dark:bg-gray-800 rounded-xl shadow p-6 max-w-2xl mx-auto space-y-6">
                     <h2 className="text-xl font-bold border-b border-gray-200 dark:border-gray-700 pb-2"><i className="fa-solid fa-sliders text-blue-600 mr-2"></i> Einstellungen</h2>
                     
                     <div className="space-y-4">
                        <div className="bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800 p-4 rounded-xl mb-6">
                           <h4 className="font-semibold text-indigo-900 dark:text-indigo-200 mb-2"><i className="fa-solid fa-cloud-arrow-down"></i> Daten Sichern & Übertragen</h4>
                           <div className="flex flex-wrap gap-2">
                             <button onClick={exportJSON} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm py-2 px-4 rounded shadow"><i className="fa-solid fa-download mr-2"></i> Backup speichern</button>
                             <label className="bg-white dark:bg-gray-700 border border-indigo-300 dark:border-indigo-600 cursor-pointer text-sm py-2 px-4 rounded shadow"><i className="fa-solid fa-upload mr-2"></i> Backup laden <input type="file" accept=".json" onChange={importJSON} className="hidden" /></label>
                           </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-sm mb-1">Basis-Stunden/Tag</label><input type="number" value={settings.dailyBaseHours} onChange={e => setSettings({...settings, dailyBaseHours: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Stundenlohn (€)</label><input type="number" value={settings.hourlyRate} onChange={e => setSettings({...settings, hourlyRate: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          
                          <div className="col-span-2 border-t dark:border-gray-700 pt-2 mt-2"><h4 className="font-semibold mb-2">Manuelle Startwerte</h4></div>
                          <div><label className="block text-sm mb-1">Zeitkonto (h)</label><input type="number" step="0.1" value={settings.initialZeitkonto || 0} onChange={e => setSettings({...settings, initialZeitkonto: Number(e.target.value)})} className="w-full p-2 border rounded border-blue-300 bg-blue-50 dark:bg-blue-900/20" /></div>
                          <div><label className="block text-sm mb-1">Spesenkonto C24 (€)</label><input type="number" step="0.01" value={settings.initialPersonalMoney || 0} onChange={e => setSettings({...settings, initialPersonalMoney: Number(e.target.value)})} className="w-full p-2 border rounded border-emerald-300 bg-emerald-50 dark:bg-emerald-900/20" /></div>
                          <div className="col-span-2"><label className="block text-sm mb-1">Kreditkarte Offen (€)</label><input type="number" step="0.01" value={settings.initialCreditCardDebt || 0} onChange={e => setSettings({...settings, initialCreditCardDebt: Number(e.target.value)})} className="w-full p-2 border rounded border-red-300 bg-red-50 dark:bg-red-900/20 max-w-[50%]" /></div>

                          <div className="col-span-2 border-t dark:border-gray-700 pt-2 mt-2"><h4 className="font-semibold mb-2">Zuschläge & Pauschalen</h4></div>
                          <div><label className="block text-sm mb-1">Max. Zeitkonto (h)</label><input type="number" value={settings.maxZeitkonto} onChange={e => setSettings({...settings, maxZeitkonto: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Bonus 1.+2. Ü-Std (%)</label><input type="number" value={settings.overtimeBonusPercent} onChange={e => setSettings({...settings, overtimeBonusPercent: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Bonus ab 3. Ü-Std (%)</label><input type="number" value={settings.overtimeBonusSpecialPercent || 50} onChange={e => setSettings({...settings, overtimeBonusSpecialPercent: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Kleine Spesen ab Std.</label><input type="number" value={settings.spesenSmallHours || 8} onChange={e => setSettings({...settings, spesenSmallHours: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Kleine Spesen Betrag</label><input type="number" value={settings.spesenSmallAmount || 14} onChange={e => setSettings({...settings, spesenSmallAmount: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Große Spesen (24h)</label><input type="number" value={settings.spesenLargeAmount || 28} onChange={e => setSettings({...settings, spesenLargeAmount: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">Frühstück-Abzug</label><input type="number" step="0.01" value={settings.breakfastDeduction || 5.60} onChange={e => setSettings({...settings, breakfastDeduction: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">ÜP ohne Beleg</label><input type="number" value={settings.overnightFlatrateWithoutReceipt} onChange={e => setSettings({...settings, overnightFlatrateWithoutReceipt: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                          <div><label className="block text-sm mb-1">ÜP mit Beleg</label><input type="number" value={settings.overnightFlatrateWithReceipt} onChange={e => setSettings({...settings, overnightFlatrateWithReceipt: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50 dark:bg-gray-900 dark:border-gray-600" /></div>
                        </div>

                        <div className="grid grid-cols-1 mt-6 pt-4 border-t dark:border-gray-700">
                           <h4 className="font-semibold mb-2">KI Schnittstelle</h4>
                           <div><input type="password" value={settings.geminiApiKey || ''} onChange={e => setSettings({...settings, geminiApiKey: e.target.value})} className="w-full p-2 border rounded dark:bg-gray-900 dark:border-gray-600" placeholder="AIzaSy..." /></div>
                        </div>
                     </div>
                  </div>
                )}

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpesenTracker />);
    </script>
</body>
</html>
