<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track & Travel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_SETTINGS = {
          initialZeitkonto: 0,
          initialPersonalMoney: 0,
          initialCreditCardDebt: 0,
          dailyBaseHours: 7,
          maxZeitkonto: 200,
          hourlyRate: 25.54,
          overtimeBonusPercent: 25,
          overtimeBonusSpecialPercent: 50,
          spesenSmallHours: 8,
          spesenSmallAmount: 14,
          spesenLargeAmount: 28,
          breakfastDeduction: 5.60,
          overnightFlatrateWithoutReceipt: 30, // ⚠️ Unter Vorbehalt
          overnightFlatrateWithReceipt: 30,
          geminiApiKey: '' // Für die Nutzung auf GitHub Pages
        };

        const calculateDuration = (start, end, breakMinutes) => {
          if (!start || !end) return 0;
          const [startH, startM] = start.split(':').map(Number);
          const [endH, endM] = end.split(':').map(Number);
          
          let durationMinutes = (endH * 60 + endM) - (startH * 60 + startM);
          if (durationMinutes < 0) durationMinutes += 24 * 60; // Cross midnight
          
          durationMinutes -= (breakMinutes || 0);
          return Math.max(0, durationMinutes / 60);
        };

        function SpesenTracker() {
          // State
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isScanning, setIsScanning] = useState(false);
          const fileInputRef = useRef(null);
          
          const [settings, setSettings] = useState(() => {
            const saved = localStorage.getItem('spesenSettings');
            return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
          });
          
          const [entries, setEntries] = useState(() => {
            const saved = localStorage.getItem('spesenEntries');
            return saved ? JSON.parse(saved) : [];
          });

          // Save to local storage on change
          useEffect(() => {
            localStorage.setItem('spesenSettings', JSON.stringify(settings));
          }, [settings]);

          useEffect(() => {
            localStorage.setItem('spesenEntries', JSON.stringify(entries));
          }, [entries]);

          const stats = useMemo(() => {
            let currentZeitkonto = Number(settings.initialZeitkonto || 0);
            let totalPayout = 0; // Money paid out for overtime
            let personalMoney = Number(settings.initialPersonalMoney || 0); // Spesen + Pauschalen
            let creditCardDebt = Number(settings.initialCreditCardDebt || 0); // Vorgelegte Kosten

            entries.forEach(entry => {
              // 1. Time Calculations
              if (entry.type === 'work') {
                const overtime = Math.max(0, entry.duration - settings.dailyBaseHours);
                
                // Split overtime
                let hoursToZeitkonto = 0;
                let baseHoursToPayout = 0;
                let bonus25Hours = 0;
                let bonus50Hours = 0;

                if (overtime > 0) {
                  let spaceLeft = Math.max(0, settings.maxZeitkonto - currentZeitkonto);

                  // 1. Überstunde (Geht aufs Konto. Geld & Bonus nur, wenn Konto voll ist)
                  const h1 = Math.min(1, overtime);
                  const k1 = Math.min(h1, spaceLeft);
                  const p1 = h1 - k1; // Was nicht aufs Konto passt
                  
                  hoursToZeitkonto += k1;
                  spaceLeft -= k1;
                  baseHoursToPayout += p1;
                  bonus25Hours += p1; 

                  // 2. Überstunde (Geht aufs Konto, aber 25% Bonus wird IMMER gezahlt)
                  const h2 = Math.min(1, Math.max(0, overtime - 1));
                  const k2 = Math.min(h2, spaceLeft);
                  const p2 = h2 - k2;

                  hoursToZeitkonto += k2;
                  spaceLeft -= k2;
                  baseHoursToPayout += p2;
                  bonus25Hours += h2; // H2 statt P2: Bonus wird auf die volle 2. Stunde gezahlt

                  // Ab der 3. Überstunde (Wird immer komplett ausgezahlt mit 50%)
                  const h3 = Math.max(0, overtime - 2);
                  baseHoursToPayout += h3;
                  bonus50Hours += h3;
                }

                currentZeitkonto += hoursToZeitkonto;

                // Calculate monetary payout for base hours
                totalPayout += (baseHoursToPayout * settings.hourlyRate);

                // Calculate Bonus
                if (overtime > 0) {
                  // Manuelle Nachtzulage überschreibt 25% Stunden zu 50% Stunden
                  const manualSpecial = Number(entry.specialBonusHours || 0);
                  if (manualSpecial > 0) {
                    const upgradeHours = Math.min(manualSpecial, bonus25Hours);
                    bonus25Hours -= upgradeHours;
                    bonus50Hours += upgradeHours;
                  }

                  totalPayout += (bonus25Hours * settings.hourlyRate * (settings.overtimeBonusPercent / 100));
                  totalPayout += (bonus50Hours * settings.hourlyRate * ((settings.overtimeBonusSpecialPercent || 50) / 100));
                }

                // 2. Spesen Calculations (Basierend auf Abwesenheit inkl. Pause)
                const durationGross = calculateDuration(entry.startTime, entry.endTime, 0);
                
                if (durationGross >= 24) {
                  personalMoney += settings.spesenLargeAmount;
                } else if (durationGross >= settings.spesenSmallHours) {
                  personalMoney += settings.spesenSmallAmount;
                }

                // Frühstücksabzug
                if (entry.breakfastIncluded) {
                  personalMoney -= (settings.breakfastDeduction || 5.60);
                }

                // 3. Overnight Flatrates
                if (entry.overnight === 'hotel') {
                  personalMoney += settings.overnightFlatrateWithReceipt;
                } else if (entry.overnight === 'private') {
                  personalMoney += settings.overnightFlatrateWithoutReceipt;
                }

                // 4. Expenses (Credit Card)
                const hotelCost = Number(entry.hotelCost || 0);
                const parkCost = Number(entry.parkCost || 0);
                
                creditCardDebt += (hotelCost + parkCost);
              } else if (entry.type === 'abbummeln') {
                currentZeitkonto -= entry.hours;
              } else if (entry.type === 'cc_paid') {
                creditCardDebt -= entry.amount;
              }
            });

            return {
              zeitkonto: currentZeitkonto.toFixed(2),
              payout: totalPayout.toFixed(2),
              personalMoney: personalMoney.toFixed(2),
              creditCardDebt: creditCardDebt.toFixed(2)
            };
          }, [entries, settings]);

          const [formData, setFormData] = useState({
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '16:15',
            breakMinutes: 45,
            specialBonusHours: 0,
            overnight: 'none',
            hotelCost: '',
            parkCost: '',
            breakfastIncluded: false
          });

          const handleInputChange = (e) => {
            const { name, value, type, checked } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: type === 'checkbox' ? checked : value
            }));
          };

          const handleAddEntry = (e) => {
            e.preventDefault();
            const duration = calculateDuration(formData.startTime, formData.endTime, formData.breakMinutes);
            
            const newEntry = {
              id: Date.now().toString(),
              type: 'work',
              duration,
              ...formData
            };

            setEntries([newEntry, ...entries]);
            setFormData(prev => ({ ...prev, hotelCost: '', parkCost: '', overnight: 'none', specialBonusHours: 0 }));
            setActiveTab('dashboard');
          };

          const deleteEntry = (id) => {
            setEntries(entries.filter(e => e.id !== id));
          };

          const handleAbbummeln = () => {
            const hours = parseFloat(prompt("Wie viele Stunden vom Zeitkonto abbummeln?"));
            if (hours && hours > 0) {
              setEntries([{ id: Date.now().toString(), type: 'abbummeln', date: new Date().toISOString().split('T')[0], hours }, ...entries]);
            }
          };

          const handleCCPaid = () => {
            const amount = parseFloat(prompt("Welcher Betrag wurde von der Kreditkarte abgebucht?"));
            if (amount && amount > 0) {
              setEntries([{ id: Date.now().toString(), type: 'cc_paid', date: new Date().toISOString().split('T')[0], amount }, ...entries]);
            }
          };

          const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const apiKey = settings.geminiApiKey || "";
            if (!apiKey) {
                alert("Bitte trage zuerst deinen Gemini API Key in den Einstellungen ein, um den KI Scan auf GitHub Pages zu nutzen!");
                return;
            }

            setIsScanning(true);
            try {
              const reader = new FileReader();
              reader.onloadend = async () => {
                const base64Data = reader.result.split(',')[1];
                const payload = {
                  contents: [{
                    role: "user",
                    parts: [
                      { text: "Lese die Daten aus dem Timesheet aus und antworte NUR mit JSON: { \"date\": \"YYYY-MM-DD\", \"startTime\": \"HH:MM\", \"endTime\": \"HH:MM\", \"breakMinutes\": Zahl (Standard 45), \"hotelCost\": Zahl, \"parkCost\": Zahl }. Keine Markdown Blöcke, nur pures JSON." },
                      { inlineData: { mimeType: file.type, data: base64Data } }
                    ]
                  }],
                  generationConfig: { responseMimeType: "application/json" }
                };
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("API Error");
                
                const result = await response.json();
                const jsonText = result.candidates[0].content.parts[0].text;
                const data = JSON.parse(jsonText);
                
                setFormData(prev => ({
                  ...prev,
                  date: data.date || prev.date,
                  startTime: data.startTime || prev.startTime,
                  endTime: data.endTime || prev.endTime,
                  breakMinutes: data.breakMinutes !== undefined ? data.breakMinutes : 45,
                  hotelCost: data.hotelCost || prev.hotelCost,
                  parkCost: data.parkCost || prev.parkCost
                }));
                setIsScanning(false);
              };
              reader.readAsDataURL(file);
            } catch (error) {
              console.error("AI Scan fehlgeschlagen", error);
              alert("Scan fehlgeschlagen. Ist der API Key korrekt?");
              setIsScanning(false);
            }
          };

          return (
            <div className="min-h-screen pb-10">
              {/* Navigation */}
              <nav className="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-10">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <h1 className="text-xl font-bold flex items-center gap-2">
                    <i className="fa-solid fa-wallet text-xl"></i> Track & Travel
                  </h1>
                  <div className="flex gap-4">
                     <button onClick={() => setActiveTab('dashboard')} className={`p-2 rounded ${activeTab === 'dashboard' ? 'bg-blue-800' : 'hover:bg-blue-800'}`}><i className="fa-solid fa-calculator text-xl"></i></button>
                     <button onClick={() => setActiveTab('track')} className={`p-2 rounded ${activeTab === 'track' ? 'bg-blue-800' : 'hover:bg-blue-800'}`}><i className="fa-solid fa-circle-plus text-xl"></i></button>
                     <button onClick={() => setActiveTab('history')} className={`p-2 rounded ${activeTab === 'history' ? 'bg-blue-800' : 'hover:bg-blue-800'}`}><i className="fa-solid fa-list text-xl"></i></button>
                     <button onClick={() => setActiveTab('settings')} className={`p-2 rounded ${activeTab === 'settings' ? 'bg-blue-800' : 'hover:bg-blue-800'}`}><i className="fa-solid fa-gear text-xl"></i></button>
                  </div>
                </div>
              </nav>

              <main className="max-w-4xl mx-auto p-4 py-8">
                
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Deine Übersicht</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {/* Zeitkonto Card */}
                      <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center">
                        <i className="fa-solid fa-clock text-4xl text-blue-500 mb-2"></i>
                        <h3 className="text-gray-500 font-medium">Zeitkonto</h3>
                        <div className="text-4xl font-bold text-gray-800 my-2">
                          {stats.zeitkonto} <span className="text-xl text-gray-400 font-normal">/ {settings.maxZeitkonto}h</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                          <div className="bg-blue-500 h-2.5 rounded-full" style={{ width: `${Math.min(100, (stats.zeitkonto / settings.maxZeitkonto) * 100)}%` }}></div>
                        </div>
                        <button onClick={handleAbbummeln} className="mt-4 text-sm text-blue-600 hover:underline">Stunden abbummeln</button>
                      </div>

                      {/* Payout Card */}
                      <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center">
                        <i className="fa-solid fa-wallet text-4xl text-emerald-500 mb-2"></i>
                        <h3 className="text-gray-500 font-medium">Mein Spesenkonto (Gehört mir)</h3>
                        <div className="text-4xl font-bold text-emerald-600 my-2">
                          {stats.personalMoney} €
                        </div>
                        <p className="text-xs text-gray-400">Pauschalen & Verpflegungsmehraufwand</p>
                        <div className="mt-4 pt-4 border-t border-gray-100 w-full">
                           <div className="flex justify-between text-sm">
                              <span className="text-gray-500">Ausbezahlte Überstunden/Boni:</span>
                              <span className="font-bold text-gray-700">{stats.payout} €</span>
                           </div>
                        </div>
                      </div>

                      {/* CC Debt Card */}
                      <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center md:col-span-2">
                        <i className="fa-solid fa-credit-card text-4xl text-red-500 mb-2"></i>
                        <h3 className="text-gray-500 font-medium">Offen bei Kreditkarte</h3>
                        <div className="text-4xl font-bold text-red-600 my-2">
                          {stats.creditCardDebt} €
                        </div>
                        <p className="text-xs text-gray-400 mb-4">Dieses Geld streckst du aktuell vor.</p>
                        <button onClick={handleCCPaid} className="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-4 rounded-lg text-sm transition-colors">
                          Kreditkarten-Abrechnung bezahlt
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'track' && (
                  <div className="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                    <div className="p-6 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-blue-900">Neuer Eintrag</h2>
                        <p className="text-sm text-blue-700">Erfasse Arbeitszeit und Auslagen</p>
                      </div>
                      <div>
                        <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                        <button 
                          type="button"
                          onClick={() => fileInputRef.current?.click()} 
                          disabled={isScanning}
                          className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors disabled:opacity-50"
                        >
                          <i className="fa-solid fa-camera"></i> {isScanning ? 'Scannt...' : 'KI Scan'}
                        </button>
                      </div>
                    </div>
                    
                    <form onSubmit={handleAddEntry} className="p-6 space-y-6">
                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-clock"></i> Arbeitszeit</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Datum</label>
                            <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Pause (Minuten)</label>
                            <input type="number" name="breakMinutes" value={formData.breakMinutes} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" min="0" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Startzeit</label>
                            <input type="time" name="startTime" value={formData.startTime} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Endzeit</label>
                            <input type="time" name="endTime" value={formData.endTime} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1" title="Ab der 3. Überstunde werden 50% automatisch berechnet!">Manuelle Nachtzulage (Std. mit 50%)</label>
                            <input type="number" step="0.25" min="0" name="specialBonusHours" value={formData.specialBonusHours} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="z.B. 1.5" />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-moon"></i> Reise & Übernachtung</h3>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          <div className="col-span-1 md:col-span-3">
                            <label className="block text-sm text-gray-600 mb-2">Übernachtung</label>
                            <div className="flex gap-4">
                              <label className="flex items-center gap-2">
                                <input type="radio" name="overnight" value="none" checked={formData.overnight === 'none'} onChange={handleInputChange} /> Keine
                              </label>
                              <label className="flex items-center gap-2">
                                <input type="radio" name="overnight" value="hotel" checked={formData.overnight === 'hotel'} onChange={handleInputChange} /> Hotel (mit Beleg)
                              </label>
                              <label className="flex items-center gap-2">
                                <input type="radio" name="overnight" value="private" checked={formData.overnight === 'private'} onChange={handleInputChange} /> Privat (ohne Beleg)
                              </label>
                            </div>
                          </div>

                          {formData.overnight === 'hotel' && (
                            <React.Fragment>
                              <div>
                                <label className="block text-sm text-gray-600 mb-1">Hotelkosten (€)</label>
                                <input type="number" step="0.01" name="hotelCost" value={formData.hotelCost} onChange={handleInputChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" />
                              </div>
                              <div className="flex items-end pb-2">
                                 <label className="flex items-center gap-2 text-sm text-gray-600">
                                  <input type="checkbox" name="breakfastIncluded" checked={formData.breakfastIncluded} onChange={handleInputChange} className="rounded" /> <i className="fa-solid fa-mug-hot"></i> inkl. Frühstück
                                </label>
                              </div>
                            </React.Fragment>
                          )}
                          
                          <div className={formData.overnight === 'hotel' ? "" : "col-span-3 md:col-span-1"}>
                            <label className="block text-sm text-gray-600 mb-1">Parkkosten (€)</label>
                            <div className="relative">
                               <i className="fa-solid fa-car absolute left-3 top-3 text-gray-400"></i>
                               <input type="number" step="0.01" name="parkCost" value={formData.parkCost} onChange={handleInputChange} className="w-full p-2 pl-9 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" />
                            </div>
                          </div>
                        </div>
                      </div>

                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i className="fa-solid fa-circle-check text-xl"></i> Eintrag speichern
                      </button>
                    </form>
                  </div>
                )}

                {activeTab === 'history' && (
                  <div className="bg-white rounded-xl shadow overflow-hidden">
                     <div className="p-6 border-b border-gray-100">
                        <h2 className="text-xl font-bold text-gray-800">Verlauf</h2>
                     </div>
                     <div className="overflow-x-auto">
                       <table className="w-full text-left border-collapse">
                         <thead>
                           <tr className="bg-gray-50 text-gray-500 text-sm border-b">
                             <th className="p-4">Datum</th>
                             <th className="p-4">Typ</th>
                             <th className="p-4">Details</th>
                             <th className="p-4 text-right">Aktion</th>
                           </tr>
                         </thead>
                         <tbody>
                           {entries.length === 0 ? (
                             <tr><td colSpan="4" className="p-4 text-center text-gray-400">Keine Einträge vorhanden</td></tr>
                           ) : entries.map(entry => (
                             <tr key={entry.id} className="border-b border-gray-50 hover:bg-gray-50">
                               <td className="p-4">{new Date(entry.date).toLocaleDateString('de-DE')}</td>
                               <td className="p-4">
                                 {entry.type === 'work' && <span className="bg-blue-100 text-blue-700 py-1 px-2 rounded text-xs">Arbeitstag</span>}
                                 {entry.type === 'abbummeln' && <span className="bg-orange-100 text-orange-700 py-1 px-2 rounded text-xs">Abfeiern</span>}
                                 {entry.type === 'cc_paid' && <span className="bg-green-100 text-green-700 py-1 px-2 rounded text-xs">Kreditkarte Bezahlt</span>}
                               </td>
                               <td className="p-4 text-sm text-gray-600">
                                 {entry.type === 'work' && (
                                   <div>
                                     {entry.duration.toFixed(2)}h ({entry.startTime} - {entry.endTime})
                                     {entry.hotelCost > 0 && <span className="ml-2 text-red-500">Hotel: {entry.hotelCost}€</span>}
                                   </div>
                                 )}
                                 {entry.type === 'abbummeln' && `-${entry.hours}h vom Zeitkonto`}
                                 {entry.type === 'cc_paid' && `${entry.amount}€ abgebucht`}
                               </td>
                               <td className="p-4 text-right">
                                 <button onClick={() => deleteEntry(entry.id)} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button>
                               </td>
                             </tr>
                           ))}
                         </tbody>
                       </table>
                     </div>
                  </div>
                )}

                {activeTab === 'settings' && (
                  <div className="bg-white rounded-xl shadow p-6 max-w-2xl mx-auto space-y-6">
                     <h2 className="text-xl font-bold text-gray-800 border-b pb-2">Regeln & Parameter</h2>
                     
                     <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                          <div className="col-span-2">
                             <div className="bg-blue-50 p-4 rounded-lg text-sm text-blue-800">
                               Pass hier die Werte an, damit die App exakt zu deinem Arbeitsvertrag passt. Alle Berechnungen im Dashboard updaten sich sofort!
                             </div>
                          </div>

                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Basis-Stunden/Tag</label>
                            <input type="number" value={settings.dailyBaseHours} onChange={e => setSettings({...settings, dailyBaseHours: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Stundenlohn (€)</label>
                            <input type="number" value={settings.hourlyRate} onChange={e => setSettings({...settings, hourlyRate: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          
                          <div className="col-span-2 border-t pt-2 mt-2">
                            <h4 className="font-semibold text-gray-700 mb-2">Aktuelle Startwerte</h4>
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Zeitkonto (h)</label>
                            <input type="number" step="0.1" value={settings.initialZeitkonto || 0} onChange={e => setSettings({...settings, initialZeitkonto: Number(e.target.value)})} className="w-full p-2 border rounded border-blue-300 bg-blue-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Spesenkonto (€)</label>
                            <input type="number" step="0.01" value={settings.initialPersonalMoney || 0} onChange={e => setSettings({...settings, initialPersonalMoney: Number(e.target.value)})} className="w-full p-2 border rounded border-emerald-300 bg-emerald-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Kreditkarte Offen (€)</label>
                            <input type="number" step="0.01" value={settings.initialCreditCardDebt || 0} onChange={e => setSettings({...settings, initialCreditCardDebt: Number(e.target.value)})} className="w-full p-2 border rounded border-red-300 bg-red-50" />
                          </div>

                          <div className="col-span-2 border-t pt-2 mt-2">
                            <h4 className="font-semibold text-gray-700 mb-2">Regeln & Boni</h4>
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Max. Zeitkonto (h)</label>
                            <input type="number" value={settings.maxZeitkonto} onChange={e => setSettings({...settings, maxZeitkonto: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Bonus Standard (%)</label>
                            <input type="number" value={settings.overtimeBonusPercent} onChange={e => setSettings({...settings, overtimeBonusPercent: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Bonus Nacht/Sonder (%)</label>
                            <input type="number" value={settings.overtimeBonusSpecialPercent || 50} onChange={e => setSettings({...settings, overtimeBonusSpecialPercent: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                        </div>

                        <h3 className="font-semibold text-gray-700 mt-6 pt-4 border-t">Spesen & Pauschalen</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Kleine Spesen (ab Std.)</label>
                            <input type="number" value={settings.spesenSmallHours || 8} onChange={e => setSettings({...settings, spesenSmallHours: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Betrag Kleine Spesen (€)</label>
                            <input type="number" value={settings.spesenSmallAmount || 14} onChange={e => setSettings({...settings, spesenSmallAmount: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">24h Spesen (€)</label>
                            <input type="number" value={settings.spesenLargeAmount || 28} onChange={e => setSettings({...settings, spesenLargeAmount: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Frühstück-Abzug (€)</label>
                            <input type="number" step="0.01" value={settings.breakfastDeduction || 5.60} onChange={e => setSettings({...settings, breakfastDeduction: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">ÜP ohne Beleg (€)</label>
                            <div className="relative">
                              <input type="number" value={settings.overnightFlatrateWithoutReceipt} onChange={e => setSettings({...settings, overnightFlatrateWithoutReceipt: Number(e.target.value)})} className="w-full p-2 border rounded border-orange-300" />
                              <span className="absolute -top-5 right-0 text-xs text-orange-500 font-bold">⚠️ Prüfen!</span>
                            </div>
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">ÜP mit Beleg (€)</label>
                            <input type="number" value={settings.overnightFlatrateWithReceipt} onChange={e => setSettings({...settings, overnightFlatrateWithReceipt: Number(e.target.value)})} className="w-full p-2 border rounded" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 mt-6 pt-4 border-t">
                           <h4 className="font-semibold text-gray-700 mb-2">System (Für GitHub Pages)</h4>
                           <div>
                            <label className="block text-sm text-gray-600 mb-1">Gemini API Key (für KI-Scan)</label>
                            <input type="password" value={settings.geminiApiKey || ''} onChange={e => setSettings({...settings, geminiApiKey: e.target.value})} className="w-full p-2 border rounded bg-gray-50" placeholder="AIzaSy..." />
                            <p className="text-xs text-gray-500 mt-1">Hier kannst du dir einen Google Gemini API Schlüssel eintragen, damit der Foto-Scan deiner Timesheets auch von GitHub aus funktioniert.</p>
                          </div>
                        </div>
                     </div>
                  </div>
                )}

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpesenTracker />);
    </script>
</body>
</html>
