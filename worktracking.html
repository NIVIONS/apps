<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track & Travel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Spezielle Druck-Stile für den PDF/A4 Export */
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 12px; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_SETTINGS = {
          initialZeitkonto: 0,
          initialPersonalMoney: 0,
          initialCreditCardDebt: 0,
          dailyBaseHours: 7,
          maxZeitkonto: 200,
          hourlyRate: 25.54,
          overtimeBonusPercent: 25,
          overtimeBonusSpecialPercent: 50,
          spesenSmallHours: 8,
          spesenSmallAmount: 14,
          spesenLargeAmount: 28,
          breakfastDeduction: 5.60,
          overnightFlatrateWithoutReceipt: 30, // ⚠️ Unter Vorbehalt
          overnightFlatrateWithReceipt: 30,
          geminiApiKey: '' // Für die Nutzung auf GitHub Pages
        };

        const calculateDuration = (start, end, breakMinutes) => {
          if (!start || !end) return 0;
          const [startH, startM] = start.split(':').map(Number);
          const [endH, endM] = end.split(':').map(Number);
          
          let durationMinutes = (endH * 60 + endM) - (startH * 60 + startM);
          if (durationMinutes < 0) durationMinutes += 24 * 60; // Cross midnight
          
          durationMinutes -= (breakMinutes || 0);
          return Math.max(0, durationMinutes / 60);
        };

        function SpesenTracker() {
          // State
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isScanning, setIsScanning] = useState(false);
          const fileInputRef = useRef(null);
          
          const [settings, setSettings] = useState(() => {
            const saved = localStorage.getItem('spesenSettings');
            return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
          });
          
          const [entries, setEntries] = useState(() => {
            const saved = localStorage.getItem('spesenEntries');
            return saved ? JSON.parse(saved) : [];
          });

          // Save to local storage on change
          useEffect(() => {
            localStorage.setItem('spesenSettings', JSON.stringify(settings));
          }, [settings]);

          useEffect(() => {
            localStorage.setItem('spesenEntries', JSON.stringify(entries));
          }, [entries]);

          const stats = useMemo(() => {
            let currentZeitkonto = Number(settings.initialZeitkonto || 0);
            let totalPayout = 0; // Money paid out for overtime (Girokonto)
            let personalMoney = Number(settings.initialPersonalMoney || 0); // Spesen + Pauschalen (Spesenkonto C24)
            let creditCardDebt = Number(settings.initialCreditCardDebt || 0); // Vorgelegte Kosten
            let auslagenErstattung = 0; // Das Geld, das aufs Spesenkonto zurückfließt (Hotel, Parken, Sonstiges)

            entries.forEach(entry => {
              // 1. Time Calculations
              if (entry.type === 'work') {
                const overtime = Math.max(0, entry.duration - settings.dailyBaseHours);
                
                // Split overtime
                let hoursToZeitkonto = 0;
                let baseHoursToPayout = 0;
                let bonus25Hours = 0;
                let bonus50Hours = 0;

                if (overtime > 0) {
                  let spaceLeft = Math.max(0, settings.maxZeitkonto - currentZeitkonto);

                  // 1. Überstunde (Geht aufs Konto. Geld & Bonus nur, wenn Konto voll ist)
                  const h1 = Math.min(1, overtime);
                  const k1 = Math.min(h1, spaceLeft);
                  const p1 = h1 - k1; // Was nicht aufs Konto passt
                  
                  hoursToZeitkonto += k1;
                  spaceLeft -= k1;
                  baseHoursToPayout += p1;
                  bonus25Hours += p1; 

                  // 2. Überstunde (Geht aufs Konto, aber 25% Bonus wird IMMER gezahlt)
                  const h2 = Math.min(1, Math.max(0, overtime - 1));
                  const k2 = Math.min(h2, spaceLeft);
                  const p2 = h2 - k2;

                  hoursToZeitkonto += k2;
                  spaceLeft -= k2;
                  baseHoursToPayout += p2;
                  bonus25Hours += h2; // Bonus wird auf die volle 2. Stunde gezahlt

                  // Ab der 3. Überstunde (Wird immer komplett ausgezahlt mit 50%)
                  const h3 = Math.max(0, overtime - 2);
                  baseHoursToPayout += h3;
                  bonus50Hours += h3;
                }

                currentZeitkonto += hoursToZeitkonto;

                // Calculate monetary payout for base hours -> Geht aufs Girokonto
                totalPayout += (baseHoursToPayout * settings.hourlyRate);

                // Calculate Bonus -> Geht aufs Girokonto
                if (overtime > 0) {
                  totalPayout += (bonus25Hours * settings.hourlyRate * (settings.overtimeBonusPercent / 100));
                  totalPayout += (bonus50Hours * settings.hourlyRate * ((settings.overtimeBonusSpecialPercent || 50) / 100));
                }

                // 2. Spesen Calculations (Basierend auf Abwesenheit inkl. Pause) -> Geht aufs Spesenkonto
                const durationGross = calculateDuration(entry.startTime, entry.endTime, 0);
                
                if (durationGross >= 24) {
                  personalMoney += settings.spesenLargeAmount;
                } else if (durationGross >= settings.spesenSmallHours) {
                  personalMoney += settings.spesenSmallAmount;
                }

                // Frühstücksabzug
                if (entry.breakfastIncluded) {
                  personalMoney -= (settings.breakfastDeduction || 5.60);
                }

                // 3. Overnight Flatrates -> Geht aufs Spesenkonto
                if (entry.overnight === 'receipt') {
                  personalMoney += settings.overnightFlatrateWithReceipt;
                } else if (entry.overnight === 'noreceipt') {
                  personalMoney += settings.overnightFlatrateWithoutReceipt;
                }

                // 4. Expenses (Credit Card & Rückerstattung aufs Spesenkonto)
                const hotelCost = Number(entry.hotelCost || 0);
                const parkCost = Number(entry.parkCost || 0);
                const sonstigesCost = Number(entry.sonstigesCost || 0);
                
                const totalAuslagen = hotelCost + parkCost + sonstigesCost;
                
                // Wir schulden der KK dieses Geld
                creditCardDebt += totalAuslagen;
                // Die Firma überweist uns diese Auslagen aber zurück aufs Spesenkonto
                auslagenErstattung += totalAuslagen;

              } else if (entry.type === 'abbummeln') {
                currentZeitkonto -= entry.hours;
              } else if (entry.type === 'cc_paid') {
                creditCardDebt -= entry.amount;
              }
            });

            // Das gesamte Guthaben auf dem Spesenkonto ist: Echte Spesen + zurückgezahlte Auslagen
            const totalSpesenkonto = personalMoney + auslagenErstattung;

            return {
              zeitkonto: currentZeitkonto.toFixed(2),
              payout: totalPayout.toFixed(2),
              spesenkonto: totalSpesenkonto.toFixed(2),
              creditCardDebt: creditCardDebt.toFixed(2)
            };
          }, [entries, settings]);

          const [formData, setFormData] = useState({
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '16:15',
            breakMinutes: 45,
            overnight: 'none',
            hotelCost: '',
            parkCost: '',
            sonstigesCost: '',
            breakfastIncluded: false
          });

          const handleInputChange = (e) => {
            const { name, value, type, checked } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: type === 'checkbox' ? checked : value
            }));
          };

          const handleAddEntry = (e) => {
            e.preventDefault();
            const duration = calculateDuration(formData.startTime, formData.endTime, formData.breakMinutes);
            
            const newEntry = {
              id: Date.now().toString(),
              type: 'work',
              duration,
              ...formData
            };

            setEntries([newEntry, ...entries]);
            setFormData(prev => ({ ...prev, hotelCost: '', parkCost: '', sonstigesCost: '', overnight: 'none', breakfastIncluded: false }));
            setActiveTab('dashboard');
          };

          const deleteEntry = (id) => {
            if(window.confirm("Eintrag wirklich löschen?")) {
               setEntries(entries.filter(e => e.id !== id));
            }
          };

          const handleAbbummeln = () => {
            const hours = parseFloat(prompt("Wie viele Stunden vom Zeitkonto abbummeln?"));
            if (hours && hours > 0) {
              setEntries([{ id: Date.now().toString(), type: 'abbummeln', date: new Date().toISOString().split('T')[0], hours }, ...entries]);
            }
          };

          const handleCCPaid = () => {
            const amount = parseFloat(prompt("Welcher Betrag wurde von der Kreditkarte abgebucht?"));
            if (amount && amount > 0) {
              setEntries([{ id: Date.now().toString(), type: 'cc_paid', date: new Date().toISOString().split('T')[0], amount }, ...entries]);
            }
          };

          // --- Export / Import Funktionen ---
          const exportJSON = () => {
             const dataStr = JSON.stringify({ settings, entries });
             const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
             const exportFileDefaultName = `TrackTravel_Backup_${new Date().toISOString().split('T')[0]}.json`;
             const linkElement = document.createElement('a');
             linkElement.setAttribute('href', dataUri);
             linkElement.setAttribute('download', exportFileDefaultName);
             linkElement.click();
          };

          const importJSON = (e) => {
             const file = e.target.files[0];
             if (!file) return;
             const reader = new FileReader();
             reader.onload = (event) => {
                try {
                   const data = JSON.parse(event.target.result);
                   if(data.settings) setSettings(data.settings);
                   if(data.entries) setEntries(data.entries);
                   alert("Daten erfolgreich importiert!");
                } catch(err) {
                   alert("Fehler beim Lesen der Datei. Ist es ein gültiges Backup?");
                }
             };
             reader.readAsText(file);
          };

          const exportCSV = () => {
             let csvContent = "data:text/csv;charset=utf-8,";
             csvContent += "Datum,Typ,Dauer(h),Start,Ende,Pause(Min),Hotel(€),Parken(€),Sonstiges(€),Übernachtungs-Typ\n";
             
             entries.forEach(e => {
                const row = [
                   e.date,
                   e.type,
                   e.duration ? e.duration.toFixed(2) : (e.hours ? `-${e.hours}` : ''),
                   e.startTime || '',
                   e.endTime || '',
                   e.breakMinutes || '',
                   e.hotelCost || '',
                   e.parkCost || '',
                   e.sonstigesCost || '',
                   e.overnight || ''
                ].join(",");
                csvContent += row + "\n";
             });

             const encodedUri = encodeURI(csvContent);
             const link = document.createElement("a");
             link.setAttribute("href", encodedUri);
             link.setAttribute("download", `Zeiten_Spesen_${new Date().toISOString().split('T')[0]}.csv`);
             document.body.appendChild(link);
             link.click();
          };

          // KI Scan Feature
          const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const apiKey = settings.geminiApiKey || "";
            if (!apiKey) {
                alert("Bitte trage zuerst deinen Gemini API Key in den Einstellungen ein, um den KI Scan auf GitHub Pages zu nutzen!");
                return;
            }

            setIsScanning(true);
            try {
              const reader = new FileReader();
              reader.onloadend = async () => {
                const base64Data = reader.result.split(',')[1];
                const payload = {
                  contents: [{
                    role: "user",
                    parts: [
                      { text: "Lese die Daten aus dem Timesheet aus und antworte NUR mit JSON: { \"date\": \"YYYY-MM-DD\", \"startTime\": \"HH:MM\", \"endTime\": \"HH:MM\", \"breakMinutes\": Zahl (Standard 45), \"hotelCost\": Zahl, \"parkCost\": Zahl }. Keine Markdown Blöcke, nur pures JSON." },
                      { inlineData: { mimeType: file.type, data: base64Data } }
                    ]
                  }],
                  generationConfig: { responseMimeType: "application/json" }
                };
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("API Error");
                
                const result = await response.json();
                const jsonText = result.candidates[0].content.parts[0].text;
                const data = JSON.parse(jsonText);
                
                setFormData(prev => ({
                  ...prev,
                  date: data.date || prev.date,
                  startTime: data.startTime || prev.startTime,
                  endTime: data.endTime || prev.endTime,
                  breakMinutes: data.breakMinutes !== undefined ? data.breakMinutes : 45,
                  hotelCost: data.hotelCost || prev.hotelCost,
                  parkCost: data.parkCost || prev.parkCost
                }));
                setIsScanning(false);
              };
              reader.readAsDataURL(file);
            } catch (error) {
              console.error("AI Scan fehlgeschlagen", error);
              alert("Scan fehlgeschlagen. Ist der API Key korrekt?");
              setIsScanning(false);
            }
          };

          return (
            <div className="min-h-screen pb-10 bg-gray-50">
              {/* Navigation */}
              <nav className="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-10 no-print">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <h1 className="text-xl font-bold flex items-center gap-2">
                    <i className="fa-solid fa-truck-fast text-xl"></i> Track & Travel
                  </h1>
                  <div className="flex gap-2 sm:gap-4">
                     <button onClick={() => setActiveTab('dashboard')} className={`p-2 rounded ${activeTab === 'dashboard' ? 'bg-blue-800' : 'hover:bg-blue-800'}`} title="Dashboard"><i className="fa-solid fa-chart-pie text-xl"></i></button>
                     <button onClick={() => setActiveTab('track')} className={`p-2 rounded ${activeTab === 'track' ? 'bg-blue-800' : 'hover:bg-blue-800'}`} title="Neuer Eintrag"><i className="fa-solid fa-circle-plus text-xl"></i></button>
                     <button onClick={() => setActiveTab('history')} className={`p-2 rounded ${activeTab === 'history' ? 'bg-blue-800' : 'hover:bg-blue-800'}`} title="Verlauf"><i className="fa-solid fa-book-open text-xl"></i></button>
                     <button onClick={() => setActiveTab('settings')} className={`p-2 rounded ${activeTab === 'settings' ? 'bg-blue-800' : 'hover:bg-blue-800'}`} title="Einstellungen"><i className="fa-solid fa-gear text-xl"></i></button>
                  </div>
                </div>
              </nav>

              <main className="max-w-4xl mx-auto p-4 py-8 print-container">
                
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">Konten & Übersicht</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {/* Zeitkonto Card */}
                      <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center">
                        <i className="fa-solid fa-clock text-4xl text-blue-500 mb-2"></i>
                        <h3 className="text-gray-500 font-medium">Zeitkonto</h3>
                        <div className="text-4xl font-bold text-gray-800 my-2">
                          {stats.zeitkonto} <span className="text-xl text-gray-400 font-normal">/ {settings.maxZeitkonto}h</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                          <div className="bg-blue-500 h-2.5 rounded-full" style={{ width: `${Math.min(100, (stats.zeitkonto / settings.maxZeitkonto) * 100)}%` }}></div>
                        </div>
                        <button onClick={handleAbbummeln} className="mt-4 text-sm text-blue-600 hover:underline"><i className="fa-solid fa-minus-circle"></i> Stunden abbummeln</button>
                      </div>

                      {/* Girokonto Card */}
                      <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center">
                        <i className="fa-solid fa-building-columns text-4xl text-emerald-500 mb-2"></i>
                        <h3 className="text-gray-500 font-medium">Girokonto / Lohn</h3>
                        <div className="text-4xl font-bold text-emerald-600 my-2">
                          + {stats.payout} €
                        </div>
                        <p className="text-xs text-gray-400">Ausbezahlte Überstunden & Boni</p>
                      </div>

                      {/* Spesenkonto (C24) Card */}
                      <div className="bg-white p-6 rounded-xl shadow border-l-4 border-l-blue-400 flex flex-col items-center text-center md:col-span-2">
                        <div className="flex items-center justify-center gap-3 mb-2">
                            <i className="fa-solid fa-wallet text-3xl text-blue-600"></i>
                            <h3 className="text-gray-600 font-bold text-lg">Spesenkonto (C24 Bank)</h3>
                        </div>
                        <div className="text-5xl font-bold text-blue-700 my-2">
                          {stats.spesenkonto} €
                        </div>
                        <p className="text-sm text-gray-500 max-w-lg mx-auto">
                          Dieses Geld gehört auf dein separates Spesenkonto. Es beinhaltet deine <b>Verpflegungspauschalen</b>, <b>Übernachtungspauschalen</b> sowie die <b>Rückerstattung deiner vorgestreckten Auslagen</b>.
                        </p>
                      </div>

                      {/* CC Debt Card */}
                      <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center md:col-span-2">
                        <div className="flex justify-between w-full items-center mb-4">
                           <div className="flex items-center gap-2">
                               <i className="fa-solid fa-credit-card text-2xl text-red-500"></i>
                               <h3 className="text-gray-600 font-medium text-left">Vorgestreckte Auslagen<br/><span className="text-xs text-gray-400">Noch offene Rechnungen der Kreditkarte</span></h3>
                           </div>
                           <div className="text-3xl font-bold text-red-500">
                             - {stats.creditCardDebt} €
                           </div>
                        </div>
                        <button onClick={handleCCPaid} className="w-full bg-red-50 hover:bg-red-100 text-red-700 font-semibold py-3 px-4 rounded-lg text-sm transition-colors border border-red-200">
                          <i className="fa-solid fa-check-double"></i> Kreditkarten-Abrechnung wurde vom Konto abgebucht
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'track' && (
                  <div className="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                    <div className="p-6 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-blue-900">Neuer Eintrag</h2>
                        <p className="text-sm text-blue-700">Erfasse Arbeitszeit und Auslagen</p>
                      </div>
                      <div>
                        <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                        <button 
                          type="button"
                          onClick={() => fileInputRef.current?.click()} 
                          disabled={isScanning}
                          className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors disabled:opacity-50 shadow"
                        >
                          <i className="fa-solid fa-camera"></i> {isScanning ? 'Scannt...' : 'KI Scan'}
                        </button>
                      </div>
                    </div>
                    
                    <form onSubmit={handleAddEntry} className="p-6 space-y-8">
                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-clock text-blue-500"></i> Arbeitszeit</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Datum</label>
                            <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Pause (Minuten)</label>
                            <input type="number" name="breakMinutes" value={formData.breakMinutes} onChange={handleInputChange} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" min="0" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Startzeit</label>
                            <input type="time" name="startTime" value={formData.startTime} onChange={handleInputChange} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Endzeit</label>
                            <input type="time" name="endTime" value={formData.endTime} onChange={handleInputChange} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-bed text-indigo-500"></i> Reise & Übernachtung</h3>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="col-span-1 md:col-span-2">
                            <label className="block text-sm text-gray-600 mb-3">Übernachtungsart auswählen:</label>
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'none' ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50'}`}>
                                <input type="radio" name="overnight" value="none" checked={formData.overnight === 'none'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-house text-gray-400 block mb-1"></i> Keine
                              </label>
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'hotel' ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50'}`}>
                                <input type="radio" name="overnight" value="hotel" checked={formData.overnight === 'hotel'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-bell-concierge text-indigo-400 block mb-1"></i> Hotelbuchung
                              </label>
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'receipt' ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50'}`}>
                                <input type="radio" name="overnight" value="receipt" checked={formData.overnight === 'receipt'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-file-invoice text-emerald-400 block mb-1"></i> ÜP mit Beleg
                              </label>
                              <label className={`cursor-pointer border rounded-lg p-3 text-center transition-all ${formData.overnight === 'noreceipt' ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50'}`}>
                                <input type="radio" name="overnight" value="noreceipt" checked={formData.overnight === 'noreceipt'} onChange={handleInputChange} className="hidden" /> 
                                <i className="fa-solid fa-user-group text-orange-400 block mb-1"></i> ÜP ohne Beleg
                              </label>
                            </div>
                          </div>

                          {formData.overnight === 'hotel' && (
                            <React.Fragment>
                              <div>
                                <label className="block text-sm text-gray-600 mb-1">Hotelkosten (€)</label>
                                <input type="number" step="0.01" name="hotelCost" value={formData.hotelCost} onChange={handleInputChange} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" />
                              </div>
                              <div className="flex items-center pb-2">
                                 <label className="flex items-center gap-2 text-sm text-gray-600 cursor-pointer bg-gray-100 p-3 rounded-lg border w-full hover:bg-gray-200">
                                  <input type="checkbox" name="breakfastIncluded" checked={formData.breakfastIncluded} onChange={handleInputChange} className="rounded w-4 h-4" /> <i className="fa-solid fa-mug-hot text-amber-600"></i> inkl. Frühstück (-5,60€)
                                </label>
                              </div>
                            </React.Fragment>
                          )}
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h3 className="font-semibold text-gray-700 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-receipt text-red-500"></i> Weitere Auslagen</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Parkkosten (€)</label>
                            <div className="relative">
                               <i className="fa-solid fa-square-parking absolute left-4 top-4 text-gray-400"></i>
                               <input type="number" step="0.01" name="parkCost" value={formData.parkCost} onChange={handleInputChange} className="w-full p-3 pl-11 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" />
                            </div>
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Sonstiges (Leihwagen, Maut etc.) (€)</label>
                            <div className="relative">
                               <i className="fa-solid fa-car absolute left-4 top-4 text-gray-400"></i>
                               <input type="number" step="0.01" name="sonstigesCost" value={formData.sonstigesCost} onChange={handleInputChange} className="w-full p-3 pl-11 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" />
                            </div>
                          </div>
                        </div>
                      </div>

                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 text-lg shadow-lg">
                        <i className="fa-solid fa-floppy-disk text-xl"></i> Eintrag im Logbuch speichern
                      </button>
                    </form>
                  </div>
                )}

                {activeTab === 'history' && (
                  <div className="bg-white rounded-xl shadow overflow-hidden print-container">
                     <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h2 className="text-xl font-bold text-gray-800"><i className="fa-solid fa-book-open text-blue-600 mr-2"></i> Logbuch & Verlauf</h2>
                        <div className="flex gap-2 no-print">
                           <button onClick={exportCSV} className="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded flex items-center gap-2 text-sm shadow-sm">
                             <i className="fa-solid fa-file-csv text-green-600"></i> CSV
                           </button>
                           <button onClick={() => window.print()} className="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded flex items-center gap-2 text-sm shadow-sm">
                             <i className="fa-solid fa-print text-gray-600"></i> Drucken
                           </button>
                        </div>
                     </div>
                     <div className="overflow-x-auto">
                       <table className="w-full text-left border-collapse">
                         <thead>
                           <tr className="bg-gray-100 text-gray-600 text-sm border-b">
                             <th className="p-3">Datum</th>
                             <th className="p-3">Zeiten / Dauer</th>
                             <th className="p-3">Auslagen (Hotel/Park/Sonst)</th>
                             <th className="p-3">Übernachtung</th>
                             <th className="p-3 no-print text-right">Aktion</th>
                           </tr>
                         </thead>
                         <tbody>
                           {entries.length === 0 ? (
                             <tr><td colSpan="5" className="p-8 text-center text-gray-400">Keine Einträge vorhanden</td></tr>
                           ) : entries.map(entry => {
                             // Berechne Summe der Auslagen für diesen Eintrag
                             const totalAuslagen = (Number(entry.hotelCost)||0) + (Number(entry.parkCost)||0) + (Number(entry.sonstigesCost)||0);
                             let overnightText = '-';
                             if(entry.overnight === 'hotel') overnightText = 'Hotel';
                             if(entry.overnight === 'receipt') overnightText = 'ÜP mit Beleg';
                             if(entry.overnight === 'noreceipt') overnightText = 'ÜP ohne Beleg';

                             return (
                             <tr key={entry.id} className="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                               <td className="p-3 font-medium text-gray-700 whitespace-nowrap">
                                 {new Date(entry.date).toLocaleDateString('de-DE')}
                               </td>
                               
                               <td className="p-3 text-sm text-gray-600">
                                 {entry.type === 'work' && (
                                   <div>
                                     <span className="font-semibold text-blue-700">{entry.duration.toFixed(2)}h</span> <br/>
                                     <span className="text-xs text-gray-400">{entry.startTime} - {entry.endTime} (Pause: {entry.breakMinutes}m)</span>
                                   </div>
                                 )}
                                 {entry.type === 'abbummeln' && <span className="text-orange-600 font-semibold">-{entry.hours}h Abbummeln</span>}
                                 {entry.type === 'cc_paid' && <span className="text-green-600 font-semibold">KK Abgebucht</span>}
                               </td>

                               <td className="p-3 text-sm">
                                 {entry.type === 'work' && totalAuslagen > 0 ? (
                                    <div className="text-red-600 font-medium">
                                       {totalAuslagen.toFixed(2)} €
                                       <div className="text-xs text-gray-400 mt-0.5">
                                          {entry.hotelCost > 0 && `H: ${entry.hotelCost}€ `}
                                          {entry.parkCost > 0 && `P: ${entry.parkCost}€ `}
                                          {entry.sonstigesCost > 0 && `S: ${entry.sonstigesCost}€`}
                                       </div>
                                    </div>
                                 ) : <span className="text-gray-300">-</span>}
                                 {entry.type === 'cc_paid' && <span className="text-green-600 font-bold">{entry.amount} €</span>}
                               </td>

                               <td className="p-3 text-sm text-gray-600">
                                  {entry.type === 'work' ? (
                                    <span className={entry.overnight !== 'none' ? 'bg-indigo-100 text-indigo-800 py-1 px-2 rounded-full text-xs font-semibold' : ''}>
                                      {overnightText}
                                    </span>
                                  ) : ''}
                               </td>

                               <td className="p-3 text-right no-print">
                                 <button onClick={() => deleteEntry(entry.id)} className="text-red-300 hover:text-red-600 hover:bg-red-50 p-2 rounded transition-colors"><i className="fa-solid fa-trash"></i></button>
                               </td>
                             </tr>
                           )})}
                         </tbody>
                       </table>
                     </div>
                  </div>
                )}

                {activeTab === 'settings' && (
                  <div className="bg-white rounded-xl shadow p-6 max-w-2xl mx-auto space-y-6">
                     <h2 className="text-xl font-bold text-gray-800 border-b pb-2"><i className="fa-solid fa-sliders text-blue-600 mr-2"></i> Einstellungen & Regeln</h2>
                     
                     <div className="space-y-4">

                        {/* Daten Sichern / Importieren Bereich */}
                        <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-xl mb-6">
                           <h4 className="font-semibold text-indigo-900 mb-2"><i className="fa-solid fa-cloud-arrow-down"></i> Daten Sichern & Übertragen</h4>
                           <p className="text-xs text-indigo-700 mb-4">
                             Da die App lokal in deinem Browser läuft, musst du die Daten exportieren, wenn du sie vom Handy auf den PC übertragen möchtest. 
                           </p>
                           <div className="flex flex-wrap gap-2">
                             <button onClick={exportJSON} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm py-2 px-4 rounded shadow">
                               <i className="fa-solid fa-download mr-2"></i> Backup speichern
                             </button>
                             <label className="bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-50 cursor-pointer text-sm py-2 px-4 rounded shadow">
                               <i className="fa-solid fa-upload mr-2"></i> Backup laden
                               <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                             </label>
                           </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Basis-Stunden/Tag</label>
                            <input type="number" value={settings.dailyBaseHours} onChange={e => setSettings({...settings, dailyBaseHours: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Stundenlohn (€)</label>
                            <input type="number" value={settings.hourlyRate} onChange={e => setSettings({...settings, hourlyRate: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          
                          <div className="col-span-2 border-t pt-2 mt-2">
                            <h4 className="font-semibold text-gray-700 mb-2">Manuelle Startwerte korrigieren</h4>
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Zeitkonto (h)</label>
                            <input type="number" step="0.1" value={settings.initialZeitkonto || 0} onChange={e => setSettings({...settings, initialZeitkonto: Number(e.target.value)})} className="w-full p-2 border rounded border-blue-300 bg-blue-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Spesenkonto C24 (€)</label>
                            <input type="number" step="0.01" value={settings.initialPersonalMoney || 0} onChange={e => setSettings({...settings, initialPersonalMoney: Number(e.target.value)})} className="w-full p-2 border rounded border-emerald-300 bg-emerald-50" />
                          </div>
                          <div className="col-span-2">
                            <label className="block text-sm text-gray-600 mb-1">Kreditkarte Offen (€)</label>
                            <input type="number" step="0.01" value={settings.initialCreditCardDebt || 0} onChange={e => setSettings({...settings, initialCreditCardDebt: Number(e.target.value)})} className="w-full p-2 border rounded border-red-300 bg-red-50 max-w-[50%]" />
                          </div>

                          <div className="col-span-2 border-t pt-2 mt-2">
                            <h4 className="font-semibold text-gray-700 mb-2">Zuschläge & Boni</h4>
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Max. Zeitkonto (h)</label>
                            <input type="number" value={settings.maxZeitkonto} onChange={e => setSettings({...settings, maxZeitkonto: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Bonus 1.+2. Ü-Stunde (%)</label>
                            <input type="number" value={settings.overtimeBonusPercent} onChange={e => setSettings({...settings, overtimeBonusPercent: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Bonus ab 3. Ü-Stunde (%)</label>
                            <input type="number" value={settings.overtimeBonusSpecialPercent || 50} onChange={e => setSettings({...settings, overtimeBonusSpecialPercent: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                        </div>

                        <h3 className="font-semibold text-gray-700 mt-6 pt-4 border-t">Pauschalen laut HR</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Kleine Spesen (ab Std.)</label>
                            <input type="number" value={settings.spesenSmallHours || 8} onChange={e => setSettings({...settings, spesenSmallHours: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Betrag Kleine Spesen (€)</label>
                            <input type="number" value={settings.spesenSmallAmount || 14} onChange={e => setSettings({...settings, spesenSmallAmount: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Große 24h Spesen (€)</label>
                            <input type="number" value={settings.spesenLargeAmount || 28} onChange={e => setSettings({...settings, spesenLargeAmount: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">Frühstück-Abzug (€)</label>
                            <input type="number" step="0.01" value={settings.breakfastDeduction || 5.60} onChange={e => setSettings({...settings, breakfastDeduction: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">ÜP ohne Beleg (€)</label>
                            <input type="number" value={settings.overnightFlatrateWithoutReceipt} onChange={e => setSettings({...settings, overnightFlatrateWithoutReceipt: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm text-gray-600 mb-1">ÜP mit Beleg (€)</label>
                            <input type="number" value={settings.overnightFlatrateWithReceipt} onChange={e => setSettings({...settings, overnightFlatrateWithReceipt: Number(e.target.value)})} className="w-full p-2 border rounded bg-gray-50" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 mt-6 pt-4 border-t">
                           <h4 className="font-semibold text-gray-700 mb-2">KI Schnittstelle</h4>
                           <div>
                            <label className="block text-sm text-gray-600 mb-1">Gemini API Key (Google)</label>
                            <input type="password" value={settings.geminiApiKey || ''} onChange={e => setSettings({...settings, geminiApiKey: e.target.value})} className="w-full p-2 border rounded bg-white shadow-inner" placeholder="AIzaSy..." />
                          </div>
                        </div>
                     </div>
                  </div>
                )}

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpesenTracker />);
    </script>
</body>
</html>
